# Copy this file to config.toml (not in git) and set your own paths. The places the collector copies from: it only reads
# them; all copies go to data/raw/ in this project.

[study]
# the first time the Fitbit Air was worn: older data has nothing to compare with
start = '2026-10-23T13:26:00+02:00'
timezone = 'Europe/Brussels'

[sources]
# Polar H10: the files of the phone app (Polar Sensor Logger) and the sessions of the PC logger (polar_h10_logger)
polar_phone_dir = '/path/to/polar_h10_logger/phone_sessions'
polar_pc_dir = '/path/to/polar_h10_logger/pc_sessions'
# the activity the user gave each H10 session in the health dashboard (read only)
health_dashboard_db = '/path/to/health_dashboard/data/health.db'
# the phone's Health Connect export (Hume Band 2.0), synced by Dropbox
health_connect_zip = '/path/to/Dropbox/Hc/HealthConnect.zip'
# the Sleep as Android backup, synced by Dropbox
sleep_as_android_zip = '/path/to/Dropbox/Apps/Sleep Cloud Backup/Sleep as Android Data.zip'
