[project]
name = 'health-trackers-analysis'
version = '0.1.0'
description = 'How accurate and precise are consumer health trackers? Fitbit Air and Hume Band 2.0 against the Polar H10 chest strap.'
readme = 'README.md'
authors = [{ name = 'Marc Dumon', email = '7793950+marcdumon@users.noreply.github.com' }]
requires-python = '>=3.13'
dependencies = [
    "google-api",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pingouin>=0.7.0",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
hta = 'health_trackers_analysis.cli:main'

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
package-dir = { '' = 'src' }

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q --tb=short'

[tool.ruff]
line-length = 135
# the notebooks are checked through their paired .py files
extend-exclude = ['*.ipynb']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'SIM', 'RUF']
# chart text uses true minus signs and en dashes on purpose
ignore = ['RUF001', 'RUF002', 'RUF003']

[tool.ruff.format]
quote-style = 'single'

[tool.jupytext]
formats = 'ipynb,py:percent'

[tool.uv.sources]
google-api = { path = "../../google_api", editable = true }

[dependency-groups]
dev = [
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
